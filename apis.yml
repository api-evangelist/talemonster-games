aid: talemonster-games
name: TaleMonster Games
description: >-
  TaleMonster Games is a fully remote mobile game studio whose mission is to create games that
  surprise, challenge, and evolve with players. The team is united by a shared obsession for
  product craft and a deep love for games, and ships casual mobile titles to iOS and Android.
  Its debut title, Match Valley, is a casual match puzzle game published on the Apple App Store
  and Google Play. TaleMonster Games publishes no public developer API, SDK, developer portal,
  or technical documentation; this profile captures its public company and product identity.
